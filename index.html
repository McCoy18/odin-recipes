<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Tic-Tac-Toe</h1>

      <form id="player-form" class="player-form">
        <label>
          Player X
          <input id="player-x" name="playerX" type="text" value="Player X" maxlength="24" required />
        </label>
        <label>
          Player O
          <input id="player-o" name="playerO" type="text" value="Player O" maxlength="24" required />
        </label>
        <button type="submit">Start / Restart Game</button>
      </form>

      <p id="game-status" class="status" aria-live="polite">Enter names and start a game.</p>
      <div id="gameboard" class="gameboard" role="grid" aria-label="Tic-Tac-Toe board"></div>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
